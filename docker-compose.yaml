services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowmail
      POSTGRES_USER: flowmail
      POSTGRES_PASSWORD: flowmail
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmail -d flowmail"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  pgdata: